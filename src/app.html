<!doctype html>
<html lang="%paraglide.lang%" dir="%paraglide.dir%" data-site="%site%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			// Motion only, never the variant. html.js marks that scripts run, html.reduced marks
			// prefers-reduced-motion. Chips start dark only under html.js:not(.reduced).
			(function () {
				var root = document.documentElement;
				root.classList.add('js');
				if (!window.matchMedia) return;
				var query = window.matchMedia('(prefers-reduced-motion: reduce)');
				var apply = function () {
					root.classList.toggle('reduced', query.matches);
				};
				apply();
				if (query.addEventListener) query.addEventListener('change', apply);
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
