version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm:
        patterns: ['*']
    ignore:
      # TypeScript 7 is the native compiler without the JS API that @sveltejs/kit,
      # svelte-check and typescript-eslint load in-process (their peer range stops at 6.x).
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # Keep @types/node on the runtime major (.nvmrc is Node 24).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ['*']
